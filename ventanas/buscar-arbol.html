<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda con Árbol Binario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header id="headerBC">
        <h1>Buscar libro con Árbol Binario</h1>
        <button id="btnVolver">Volver al inicio</button>
    </header>

    <main class="page-shell search-page">
        <section class="search-intro" aria-labelledby="tituloBusqueda">
            <p class="eyebrow">Consulta del catálogo</p>
            <h2 id="tituloBusqueda">Encuentra un libro por su código</h2>
            <p>Escribe el código de identificación del libro para localizarlo rápidamente en el árbol binario.</p>
            <div class="search-controls">
                <label class="sr-only" for="codigoLibro">Código del libro</label>
                <input type="number" id="codigoLibro" placeholder="Ejemplo: 101" inputmode="numeric">
                <button id="btnBuscar">Buscar libro</button>
            </div>
        </section>

        <section id="resultado" aria-live="polite">
            <div class="empty-search-state">
                <span class="empty-state-icon" aria-hidden="true">⌕</span>
                <h3>Tu resultado aparecerá aquí</h3>
                <p>Ingresa un código y descubre la información, disponibilidad y detalles del libro.</p>
            </div>
        </section>
    </main>
    <script type="module" src="../scripts/scripts.js"></script>
</body>
</html>
