<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <header class="hero">

        <p class="eyebrow">Estructuras de datos aplicadas</p>

        <h1>Sistema de Biblioteca</h1>

        <p class="subtitulo">
            Catálogo, búsqueda y préstamos construidos con listas enlazadas,
            árboles binarios, grafos, pilas y colas.
        </p>

        <div id="botonesInicio">

            <button onclick="window.location.href='ventanas/buscar-arbol.html'">
                Buscar libros por medio de código
            </button>

            <button onclick="window.location.href='ventanas/prestamos.html'">
                Sistema de Préstamos
            </button>

        </div>

    </header>

    <section id="catalogoSection">

        <h2>Catálogo de libros</h2>
        <div class="orden-catalogo">
            <label for="ordenCatalogo">Ordenar Catálogo:</label>
            <select name="" id="ordenCatalogo">
                <option value="original">Orden Original</option>
                <option value="az">A - Z</option>
            </select>
        </div>

        <div id="contenedorCarrusel">

            <button id="btnAnterior" class="btnCarrusel">‹</button>

            <div id="carrusel"></div>

            <button id="btnSiguiente" class="btnCarrusel">›</button>

        </div>

    </section>

    <script type="module" src="./scripts/catalogo.js"></script>

</body>

</html>
